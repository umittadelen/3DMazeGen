<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="screen-orientation" content="landscape" />
    <title>3D Maze Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        rel="preload"
        as="style"
        href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap"
        onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" />
    </noscript>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Quicksand', sans-serif;
        }

        button,
        input,
        select,
        textarea {
            font-family: inherit;
        }

        #portrait-warning {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            z-index: 9999;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 24px;
            font-family: Arial, sans-serif;
        }

        #portrait-warning.show {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: none;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            z-index: 0;
            display: block;
        }

        #controls {
            position: absolute;
            top: max(10px, env(safe-area-inset-top));
            left: max(10px, env(safe-area-inset-left));
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 2;
            width: min(320px, calc(100vw - 20px));
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: linear-gradient(160deg, rgba(20, 20, 20, 0.82), rgba(10, 10, 10, 0.7));
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);
            box-sizing: border-box;
        }

        #upload,
        #urlBtn,
        #genBtn {
            width: 100%;
            padding: 8px 16px;
            background: rgba(30, 30, 30, 0.8);
            color: #fff;
            border: 1px solid #666;
            cursor: pointer;
            font-size: 14px;
            border-radius: 8px;
            box-sizing: border-box;
        }

        #upload:hover,
        #urlBtn:hover,
        #genBtn:hover {
            background: #383838;
        }

        #genBtn {
            background: #335b33;
        }

        #genBtn:hover {
            background: #437343;
        }

        #urlInput {
            display: none;
            padding: 6px;
            width: 100%;
            background: rgba(30, 30, 30, 0.9);
            color: #fff;
            border: 1px solid #666;
            font-size: 12px;
            border-radius: 8px;
            box-sizing: border-box;
        }

        #urlInput::placeholder {
            color: #999;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .settings-panel {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 8px;
            border: 1px solid #444;
            border-radius: 10px;
            background: rgba(18, 18, 18, 0.72);
            color: #ddd;
            font-size: 12px;
            width: 100%;
            box-sizing: border-box;
        }

        .settings-title {
            font-size: 12px;
            font-weight: 700;
            color: #9ed39e;
        }

        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .settings-panel input[type="range"] {
            width: 100%;
            margin: 0;
        }

        #info {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 12px;
            border-radius: 4px;
            z-index: 2;
            max-width: min(90vw, 760px);
            text-align: center;
            box-sizing: border-box;
            backdrop-filter: blur(4px);
        }

        @media (max-width: 768px) {
            #controls {
                left: 50%;
                transform: translateX(-50%);
                width: min(92vw, 360px);
            }

            #info {
                width: calc(100vw - 20px);
                font-size: 11px;
                bottom: 8px;
            }
        }

        #winModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 30px;
        }

        #winModal.show {
            display: flex;
        }

        #winModal .win-text {
            color: #44ff44;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 0 0 20px #44ff44;
            animation: pulse 0.6s infinite;
        }

        #winModal .win-subtext {
            color: #aaa;
            font-size: 18px;
        }

        #winModal #goBackBtn {
            padding: 12px 30px;
            background: #335b33;
            color: #fff;
            border: 2px solid #44ff44;
            cursor: pointer;
            font-size: 16px;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        #winModal #goBackBtn:hover {
            background: #437343;
            box-shadow: 0 0 15px #44ff44;
            transform: scale(1.05);
        }

        .error {
            color: #f00;
            font-size: 14px;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .joystick_container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .joystick_container.active {
            pointer-events: auto;
        }

        .left_joystick_hitbox,
        .right_joystick_hitbox {
            position: absolute;
            width: 50%;
            height: 100%;
            touch-action: none;
            pointer-events: none;
        }

        .joystick_container.active .left_joystick_hitbox,
        .joystick_container.active .right_joystick_hitbox {
            pointer-events: auto;
        }

        .left_joystick_hitbox {
            left: 0;
        }

        .right_joystick_hitbox {
            right: 0;
        }

        .left_joystick,
        .right_joystick {
            position: fixed;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            display: none;
            z-index: 1;
            box-shadow: none;
            transition: opacity 0.1s ease-out;
        }

        .left_joystick.active,
        .right_joystick.active {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .left_joystick_pointer,
        .right_joystick_pointer {
            position: absolute;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            box-shadow: none;
            transition: transform 0.05s linear;
        }
    </style>

    <link rel="manifest" href="manifest.json" />

    <link rel="apple-touch-icon" sizes="180x180" href="resources/icons/icon-180.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="resources/icons/icon-152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="resources/icons/icon-120.png" />
    <link rel="apple-touch-icon" sizes="76x76" href="resources/icons/icon-76.png" />
    <link rel="apple-touch-icon" sizes="60x60" href="resources/icons/icon-60.png" />

    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>

<body>
    <div id="portrait-warning">
        <div>📱 Please rotate your device</div>
        <div style="font-size: 16px">Hold your mobile sideways to play</div>
    </div>
    <div id="container">
        <div id="controls">
            <button id="genBtn" onclick="location.href='gen.html'">
                🎨 Generate Maze
            </button>
            <input type="file" id="upload" accept="image/*,.maze" />
            <div class="input-group">
                <button id="urlBtn">Load from URL</button>
                <input type="text" id="urlInput" placeholder="Enter image URL and press Enter..." />
            </div>
            <div id="settingsPanel" class="settings-panel">
                <div class="settings-title">Render Settings</div>
                <div class="settings-row">
                    <label for="superSampleScaleInput">Supersample</label>
                    <span id="superSampleScaleValue">1.50x</span>
                </div>
                <input
                    id="superSampleScaleInput"
                    type="range"
                    min="0.25"
                    max="4"
                    step="0.05"
                    value="1.5"
                />

                <div class="settings-row">
                    <label for="fovInput">FOV</label>
                    <span id="fovValue">60°</span>
                </div>
                <input
                    id="fovInput"
                    type="range"
                    min="45"
                    max="100"
                    step="1"
                    value="60"
                />
            </div>
        </div>
        <canvas id="canvas" width="800" height="600"></canvas>
        <div id="info">
            Load a maze image to start. Use WASD or Arrow keys to move,
            Mouse to look around.
        </div>
    </div>

    <div id="winModal">
        <div class="win-text">🎉 YOU WON! 🎉</div>
        <div class="win-subtext">Congratulations! You found the goal!</div>
        <button id="goBackBtn" onclick="goBack()">Go Back</button>
    </div>

    <div class="joystick_container">
        <div class="left_joystick_hitbox">
            <div class="left_joystick">
                <div class="left_joystick_pointer"></div>
            </div>
        </div>

        <div class="right_joystick_hitbox">
            <div class="right_joystick">
                <div class="right_joystick_pointer"></div>
            </div>
        </div>
    </div>

    <script src="./scripts/main.js"></script>
</body>

</html>
